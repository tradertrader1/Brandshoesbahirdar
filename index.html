<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STEPHOUSE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#151515;font:14px Arial,sans-serif}header{background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}.nav{max-width:1200px;margin:auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:23px;font-weight:900}.logo span{font-weight:400}.nav button,.btn{border:1px solid #ddd;background:#fff;padding:10px 13px;border-radius:8px;cursor:pointer}.btn.dark{background:#111;color:#fff;border-color:#111}.hero{max-width:1200px;margin:auto;padding:52px 20px 30px}.hero h1{font-size:48px;line-height:1;margin:0 0 12px}.muted{color:#777}.container{max-width:1200px;margin:auto;padding:15px 20px 50px}.toolbar{display:flex;gap:10px;margin-bottom:20px}.search,.select,input,textarea{padding:12px;border:1px solid #ddd;border-radius:8px;font:inherit}.search{flex:1}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.product{background:#fff;border:1px solid #e4e4e4;border-radius:12px;overflow:hidden}.photo{height:240px;background:#eee;display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:13px}.name{font-weight:800}.price{font-size:19px;font-weight:900;margin:9px 0}.old{text-decoration:line-through;color:#aaa;font-size:12px}.stock{color:#31875a;font-size:12px}.product .btn{width:100%;margin-top:10px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:5vh 15px}.box{background:white;max-width:760px;max-height:90vh;overflow:auto;margin:auto;padding:22px;border-radius:14px}.close{float:right;border:0;background:none;font-size:25px}.form{display:grid;gap:9px}.cartrow{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 0}.adminrow{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:10px 0}.tabs{display:flex;gap:8px;margin:15px 0}.order{border:1px solid #ddd;padding:12px;border-radius:9px;margin:8px 0}.status{padding:5px;border-radius:7px}.status.NEW{background:#fff0bd}.status.CONFIRMED{background:#dff7e8}.status.DELIVERED{background:#dfeaff}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:38px}}@media(max-width:450px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="nav"><div class="logo">STEP<span>HOUSE</span></div><div><button onclick="openCart()">Cart (<span id="count">0</span>)</button> <button onclick="openAdmin()">Admin</button></div></div></header>
<section class="hero"><h1>Brand-new shoes.<br>Choose yours.</h1><p class="muted">Browse available stock, choose your size and place an order.</p></section>
<main class="container"><div class="toolbar"><input id="search" class="search" placeholder="Search shoes..." oninput="render()"><select id="cat" class="select" onchange="render()"><option value="">All categories</option></select></div><div id="products" class="grid"></div></main>

<div id="cart" class="modal"><div class="box"><button class="close" onclick="closeAll()">×</button><h2>Your order</h2><div id="cartItems"></div><h3 id="total"></h3><hr><form class="form" onsubmit="checkout(event)"><input id="customer" required placeholder="Full name"><input id="phone" required placeholder="Phone / WhatsApp"><input id="address" required placeholder="Delivery address"><textarea id="notes" placeholder="Notes"></textarea><button class="btn dark">Place order</button></form></div></div>

<div id="admin" class="modal"><div class="box"><button class="close" onclick="closeAll()">×</button><h2>Store Admin</h2><div class="form"><input id="au" placeholder="Admin username" value="admin"><input id="ap" type="password" placeholder="Admin password"></div><div class="tabs"><button class="btn" onclick="loadAdmin('stock')">Stock</button><button class="btn" onclick="loadAdmin('orders')">Orders</button></div><div id="adminContent"></div></div></div>
<script>
let products=[],cart=[];let auth="";
const $=id=>document.getElementById(id), money=n=>'$'+Number(n).toFixed(2);
async function load(){products=await (await fetch('/api/products')).json();let cats=[...new Set(products.map(x=>x.category))];$('cat').innerHTML='<option value="">All categories</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join('');render();updateCount()}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){let q=$('search').value.toLowerCase(),c=$('cat').value;let ps=products.filter(p=>(p.name+' '+p.brand+' '+p.category).toLowerCase().includes(q)&&(!c||p.category===c));$('products').innerHTML=ps.map(p=>`<article class="product"><div class="photo">${p.image?`<img src="${p.image}">`:'👟'}</div><div class="body"><div class="name">${esc(p.name)}</div><div class="muted">${esc(p.brand)} • ${esc(p.category)}</div><div class="price">${money(p.price)} ${p.old_price?`<span class="old">${money(p.old_price)}</span>`:''}</div><div class="muted">Sizes: ${esc(p.sizes)}</div><div class="stock">${p.stock} in stock</div><button class="btn dark" onclick="add(${p.id})" ${p.stock<1?'disabled':''}>Add to cart</button></div></article>`).join('')||'<p>No shoes found.</p>'}
function add(id){let p=products.find(x=>x.id===id),c=cart.find(x=>x.id===id);if(!p||p.stock<1)return;if(c){if(c.qty<p.stock)c.qty++}else cart.push({id,qty:1,size:(p.sizes||'').split(',')[0].trim()});updateCount();openCart()}
function updateCount(){$('count').textContent=cart.reduce((a,c)=>a+c.qty,0)}
function openCart(){$('cart').style.display='block';renderCart()}function closeAll(){document.querySelectorAll('.modal').forEach(x=>x.style.display='none')}
function renderCart(){let total=0;$('cartItems').innerHTML=cart.length?cart.map(c=>{let p=products.find(x=>x.id===c.id);total+=p.price*c.qty;return `<div class="cartrow"><div><b>${esc(p.name)}</b><br><select onchange="size(${p.id},this.value)">${p.sizes.split(',').map(s=>`<option ${s.trim()===c.size?'selected':''}>${esc(s.trim())}</option>`).join('')}</select></div><div><button onclick="qty(${p.id},-1)">−</button> ${c.qty} <button onclick="qty(${p.id},1)">+</button></div></div>`}).join(''):'<p class="muted">Cart is empty.</p>';$('total').textContent='Total: '+money(total)}
function qty(id,d){let c=cart.find(x=>x.id===id),p=products.find(x=>x.id===id);if(!c)return;c.qty+=d;if(c.qty>p.stock)c.qty=p.stock;if(c.qty<1)cart=cart.filter(x=>x!==c);updateCount();renderCart()}function size(id,v){let c=cart.find(x=>x.id===id);if(c)c.size=v}
async function checkout(e){e.preventDefault();let items=cart.map(c=>({id:c.id,qty:c.qty,size:c.size})),total=items.reduce((a,c)=>a+products.find(p=>p.id===c.id).price*c.qty,0);let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer:$('customer').value,phone:$('phone').value,address:$('address').value,notes:$('notes').value,items,total})});let j=await r.json();if(!r.ok)return alert(j.error);alert('Order #'+j.orderId+' received. We will contact you to confirm delivery.');cart=[];closeAll();await load()}
function openAdmin(){$('admin').style.display='block'}function credentials(){auth='Basic '+btoa($('au').value+':'+$('ap').value);return {'Authorization':auth}}
async function loadAdmin(type){if(type==='stock'){let r=await fetch('/api/products');let ps=await r.json();$('adminContent').innerHTML=`<h3>Add product</h3><form class="form" id="addform" enctype="multipart/form-data"><input name="name" required placeholder="Shoe name"><input name="brand" placeholder="Brand"><input name="price" type="number" step=".01" required placeholder="Price"><input name="old_price" type="number" step=".01" placeholder="Old price"><input name="sizes" placeholder="39,40,41,42"><input name="stock" type="number" required placeholder="Stock"><input name="category" placeholder="Sneakers"><input name="image" type="file" accept="image/*"><button class="btn dark">Add shoe</button></form><h3>Current stock</h3>`+ps.map(p=>`<div class="adminrow"><span><b>${esc(p.name)}</b><br>${money(p.price)} • ${p.stock} units</span><button class="btn" onclick="del(${p.id})">Delete</button></div>`).join('');$('addform').onsubmit=addProduct}else{let r=await fetch('/api/orders',{headers:credentials()});if(!r.ok)return alert('Check admin credentials.');let os=await r.json();$('adminContent').innerHTML=os.map(o=>`<div class="order"><b>Order #${o.id}</b> — ${esc(o.customer)} — ${esc(o.phone)}<br>${esc(o.address)}<br><b>${money(o.total)}</b><br><span class="status ${o.status}">${o.status}</span> <button class="btn" onclick="status(${o.id},'CONFIRMED')">Confirm</button> <button class="btn" onclick="status(${o.id},'DELIVERED')">Delivered</button><pre>${esc(o.items)}</pre></div>`).join('')||'<p>No orders yet.</p>'}}
async function addProduct(e){e.preventDefault();let r=await fetch('/api/products',{method:'POST',headers:credentials(),body:new FormData(e.target)});if(!r.ok)return alert('Invalid admin credentials or product data.');e.target.reset();await loadAdmin('stock');await load()}
async function del(id){if(!confirm('Delete this product?'))return;await fetch('/api/products/'+id,{method:'DELETE',headers:credentials()});await loadAdmin('stock');await load()}
async function status(id,s){await fetch('/api/orders/'+id,{method:'PATCH',headers:{...credentials(),'Content-Type':'application/json'},body:JSON.stringify({status:s})});loadAdmin('orders')}
load();
</script></body></html>
